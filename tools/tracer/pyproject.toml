[project]
name = "tracer"
version = "0.1.0"
description = "Code intelligence CLI — maps architectural relationships in any codebase"
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jordan Parker" }]
dependencies = [
    "click>=8.1",
    "multilspy>=0.0.10",
    "lizard>=1.17",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-php>=0.23",
]

[project.scripts]
trace = "tracer.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer"]
