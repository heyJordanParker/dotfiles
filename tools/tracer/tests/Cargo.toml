[package]
name = "tracer-cli-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Black-box CLI integration suite for the `trace` binary"

# This crate ships no library or binary of its own — it exists purely to host
# the integration tests under `tests/`. The suite invokes whatever `trace`
# binary `TRACE_BIN` points at (default: `trace` on PATH).
[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# The on-disk cache key is a published contract (tracer Claude.md + the
# cache.rs module header): sha256("v{SCHEMA}|ccn:ast\0" + bytes + "\0" + rel).
# The schema-version-invalidation test reconstructs that key from the
# documented formula to prove an entry under a different schema version is
# unreachable. This is testing against a documented contract, not linking
# tracer internals — the boundary the suite forbids.
sha2 = "0.10"
hex = "0.4"
