[package]
name = "prompt-reviewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "review-prompt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
ureq = "2"
llama-cpp-2 = { version = "0.1.146", features = ["metal"] }
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
