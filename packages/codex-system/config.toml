model = "gpt-6-astra"
model_reasoning_effort = "medium"
approval_policy = "never"
personality = "pragmatic"

# Boot every session with the CTO prompt as base instructions (the frontmatter-
# stripped cto.md body, generated by scripts/agents.py). The global Claude.md
# still loads via ~/.codex/AGENTS.md in its own channel.
model_instructions_file = "/Users/jordan/.agents/agents/cto.prompt.md"

# Codex reads our nested Claude.md hierarchy natively — no parallel AGENTS.md needed
project_doc_fallback_filenames = ["Claude.md"]

notify = ["/Users/jordan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "default"

[agents]
max_threads = 100

[mcp_servers.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = [ "--app", "desktop" ]

# Library docs, over a bunx stdio bridge.
[mcp_servers.context7]
command = "/Users/jordan/.bun/bin/bunx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 120

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/jordan/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/jordan/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.903.71938"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/jordan/.codex/plugins/cache/openai-bundled/browser/26.903.71938/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/jordan/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[features]
multi_agent = true
goals = true
memories = true
hooks = true
js_repl = false

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."dent@getdent"]
enabled = true

# Codex draws from the shared Python hooks in packages/agents/hooks (stowed to
# ~/.agents/hooks), the same set Claude uses. Nearly the whole set runs here,
# including the intent classifier and the session-state guards; only the hooks
# that guard Claude-only tools (Agent/EnterWorktree/TeamDelete/ExitPlanMode) have
# no event to fire on and are excluded. Local-only; never plugin-distributed.
[[hooks.PermissionRequest]]
matcher = "Read|Glob|Grep|Write|Edit|NotebookEdit|Bash"
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/auto_approve_permissions.py"

[[hooks.PostToolUse]]
matcher = "Write|Edit"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/sync_shaping.py"
timeout = 5

[[hooks.PreCompact]]
[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_rules.py"
timeout = 15

[[hooks.PreToolUse]]
matcher = "Read|Glob|Grep|Edit|Write"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/enrich_on_read.py"
timeout = 15
additionalContextLimit = 0

[[hooks.PreToolUse]]
matcher = "Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_docs.py"
timeout = 15
additionalContextLimit = 0
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/combine_hooks.py block_branch_change block_composed_commands block_denied_access block_git_revert block_invalid_browsers block_memory_access block_path_assignment block_spawning block_unauthorized_commits block_unsafe_delete block_writes guard_trace protect_session_state"
timeout = 65

[[hooks.PreToolUse]]
matcher = "Agent"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_honcho_memory.py"
timeout = 20

[[hooks.PreToolUse]]
matcher = "Read|Write|Edit|apply_patch"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_rules.py"
timeout = 15
additionalContextLimit = 0

[[hooks.PreToolUse]]
matcher = "Write|Edit|MultiEdit"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/combine_hooks.py block_denied_access block_writes protect_session_state"
timeout = 15

[[hooks.PreToolUse]]
matcher = "NotebookEdit"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/combine_hooks.py block_denied_access block_writes"
timeout = 10

[[hooks.PreToolUse]]
matcher = "Agent|Workflow|RemoteTrigger"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/block_spawning.py"
timeout = 5

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_honcho_memory.py"
timeout = 20
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_rules.py"
timeout = 15
additionalContextLimit = 0
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/record_session_event.py"

[[hooks.SessionStart]]
matcher = "compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_mode_skills.py"

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/load_trace_context.py"
timeout = 20
additionalContextLimit = 0

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/close_abandoned_browsers.py"
timeout = 60
[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/remember_turn.py"
timeout = 10

[[hooks.SubagentStop]]
[[hooks.SubagentStop.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/close_abandoned_browsers.py"
timeout = 60
[[hooks.SubagentStop.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/remember_turn.py"
timeout = 10

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/classify_intent.py"
timeout = 60
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_honcho_memory.py"
timeout = 20
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/record_session_event.py"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/jordan/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/jordan/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.getdent]
