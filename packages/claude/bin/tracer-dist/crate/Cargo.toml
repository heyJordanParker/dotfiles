[package]
name = "tracer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
sha2 = "0.10"
anyhow = "1"
hex = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
walkdir = "2"
globset = "0.4"
tempfile = "3"
regex = "1"
rustix = { version = "1", features = ["fs"] }
jaq-core = "3.0"
jaq-std = "3.0"
jaq-json = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
