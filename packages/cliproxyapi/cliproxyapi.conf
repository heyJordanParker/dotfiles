config-version: 8
routing:
    strategy: "fill-first"
    session-affinity: true
    cooldown:
        disable-cooling: false
    retry:
        request-retry: 0
"plugins":
    "enabled": false
server:
    host: "127.0.0.1"
    port: 8317
    discovery:
        service-type: _ai-gateway._tcp
        subtypes:
            - _chat-completions
            - _responses
            - _messages
            - _generate-content
            - _interactions
credentials:
    concurrency:
        cpa-heartbeat-timeout: 3s
        cpa-cancel-bound: 5s
        reclaim-grace: 5s
        cleanup-interval: 5s
        release-flush-interval: 250ms
        release-max-backoff: 2s
        busy-retry-min: 250ms
        busy-retry-max: 1s
        max-limit: 1000000
    in-flight:
        snapshot-interval: 2s
        stale-after: 10s
        max-part-bytes: 262144
        max-part-count: 64
        max-revision-bytes: 16777216
        max-aggregate-groups: 100000
        max-details: 10000
        max-string-bytes: 256
        staging-retention: 1m
management:
    secret-key: "$2y$10$e8RTzIxGnQsUz0X.tQlJ6u33SNrYmrA7B0mx3k1DyssHPacQAudNe"
    disable-control-panel: false
oauth:
    auth-dir: "~/.cli-proxy-api"
    providers:
        aistudio:
            ws-auth: true
        claude:
            disable-claude-cloak-mode: true
observability:
    usage:
        redis-usage-queue-retention-seconds: 60
