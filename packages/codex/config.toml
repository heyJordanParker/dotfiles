model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approval_policy = "never"
personality = "pragmatic"

# Boot every session with the CTO prompt as base instructions (the frontmatter-
# stripped cto.md body, generated by scripts/agents.py). The global Claude.md
# still loads via ~/.codex/AGENTS.md in its own channel.
model_instructions_file = "/Users/jordan/.agents/agents/cto.prompt.md"

# Codex reads our nested Claude.md hierarchy natively — no parallel AGENTS.md needed
project_doc_fallback_filenames = ["Claude.md"]

notify = ["/Users/jordan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "default"

[mcp_servers.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = [ "--app", "desktop" ]

[mcp_servers.node_repl]
args = []
command = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/Codex.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/jordan/.codex"
CODEX_HOME = "/Users/jordan/.codex"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "5504c0782b5c86b7dd08314045b9843e973a230e1be8f7e2e0ba3716fc63c55e"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.616.81150"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"

# iai-mcp memory engine — clone-and-run service in ~/Developer/services.
# The wrapper talks to the launchd daemon over ~/.iai-mcp/.daemon.sock and
# spawns the core via IAI_MCP_PYTHON when needed. Codex gets the memory tools;
# automatic turn capture is Claude-only (ships Claude hooks).
[mcp_servers.iai-mcp]
command = "node"
args = ["/Users/jordan/Developer/services/iai-personal-memory-engine/mcp-wrapper/dist/index.js"]

[mcp_servers.iai-mcp.env]
IAI_MCP_PYTHON = "/Users/jordan/Developer/services/iai-personal-memory-engine/.venv/bin/python"
IAI_MCP_STORE = "/Users/jordan/.iai-mcp"

