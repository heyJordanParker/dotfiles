# Shared Honcho memory (self-hosted on the Nuremberg dev box, reachable over the
# tailnet). Honcho's MCP is a stateless streamable-HTTP server that Codex's native
# url transport hangs on, so we reach it through the mcp-remote stdio bridge (the
# client Honcho documents). HONCHO_TOKEN (the admin JWT) is exported from the
# machine-local untracked secrets — never committed here.
[mcp_servers.honcho]
command = "/Users/jordan/.bun/bin/bunx"
args = ["-y", "mcp-remote", "https://devbox.tailac0786.ts.net:8443/", "--header", "Authorization:Bearer ${HONCHO_TOKEN}", "--header", "X-Honcho-User-Name:jordan", "--header", "X-Honcho-Workspace-ID:parkerlabs"]
startup_timeout_sec = 120

