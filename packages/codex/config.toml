# Codex draws from the shared Python hooks in packages/agents/hooks (stowed to
# ~/.agents/hooks), the same set Claude uses. Only the stateless hooks run here:
# Codex has no intent classifier, so the intent/session-state layer is excluded,
# and hooks that guard Claude-only tools (Agent/EnterWorktree/TeamDelete/
# ExitPlanMode) have no event to fire on. Local-only; never plugin-distributed.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/load_trace_context.py"
timeout = 15
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/reload_harness_context.py"
timeout = 15
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_docs.py"
timeout = 15

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/block_git_revert.py"
timeout = 5
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/block_unsafe_delete.py"
timeout = 5
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/guard_trace.py"
timeout = 5
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/validate_planning_docs.py"
timeout = 60
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/enrich_on_read.py"
timeout = 10
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/jordan/.agents/hooks/inject_docs.py"
timeout = 15

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
